                    <input type="number" value="${s.capacity}" data-field="capacity" data-id="${s.id}" style="width:62px" min="1" />
                    <span style="flex:1; font-size:11px; color:var(--text-dim); font-family:var(--sans);">${taken} booked</span>
                    <button class="btn-danger" data-remove="${s.id}">Remove</button>
                  </div>
                  <button class="riders-toggle" data-admin-riders-toggle="${s.id}" type="button">${expanded?'Hide':'View'} riders${taken?` (${taken})`:''}</button>
                  ${ridersHtml}
                </div>`;
                }).join('') || `<div class="empty">No slots yet.</div>`;
                return `
              <div class="section-title">${dir.label}</div>
              ${rows}
              <div class="admin-add">
                <input type="text" placeholder="Time e.g. 09:00" id="newTime_${dir.id}">
                <input type="number" placeholder="Seats" value="${DEFAULT_CAPACITY}" id="newCap_${dir.id}">
                <button class="btn btn-primary" data-add="${dir.id}">Add</button>
              </div>
            `;
            }).join('');

            return `
            <header>
              <div class="board-id"><span class="live-dot"></span><span class="eyebrow" id="typed-title"></span><span class="cursor cursor-eyebrow" id="cursor-typing"></span></div>
              <div class="title-wrapper">
                <h1><span id="typed-heading" data-text="Admin"></span><span class="cursor" id="cursor-heading"></span></h1>
              </div>
              <div class="sub">Manage Slots &amp; Change Requests</div>
            </header>
            <main>
              ${metrics}
              ${renderChangeRequestsSection()}
              ${groups}
              ${renderVoteHistorySection()}
              <div class="section-title">Danger zone</div>
              <button class="btn btn-danger" id="resetVotes" style="width:100%; padding:12px; border-radius:var(--radius-sm);">Clear all bookings</button>
            </main>
            <footer><span class="admin-link" id="backLink">Back to board</span></footer>
          `;
        }

        // ─── Helper functions for render ──────────────────────────────────────
        function statusFor(slot) {
            const taken = slot.taken || 0;
            const remaining = slot.capacity - taken;
            const myVote = myVoteFor(slot.direction);
            const mine = (myVote && myVote.slotId === slot.id) ? myVote : null;
            return { taken, remaining, full: remaining <= 0, mine };
        }

        function renderChangeRequestsSection() {
            const pending = adminChangeRequests.filter(r => r.status === 'pending');
            if (pending.length === 0) return '';
            const rows = pending.map(r => {
                const slot = slots.find(s => s.id === r.slot_id);
                const dirLabel = DIRECTIONS.find(d => d.id === r.direction)?.label || r.direction;
                return `
              <div class="cr-card">
                <div class="cr-head">
                  <div class="cr-meta">
                    <span>${escapeHtml(r.username)} <span style="color:var(--text-dimmer);">#${escapeHtml(r.student_id)}</span> · ${dirLabel} · currently ${slot ? slot.time : '—'}</span>
                    ${r.note ? `<div class="cr-note">${escapeHtml(r.note)}</div>` : ''}
                  </div>
                  <span class="tag tag-low">Needs review</span>
                </div>
                <div class="cr-thumb-wrap">
                  <img class="cr-thumb" src="${r.image_data_url}" data-lightbox="${r.id}" />
                </div>
                <div style="display:flex; gap:8px;">
                  <button class="btn btn-primary" style="margin-top:0; flex:1; padding:10px;" data-approve="${r.id}">Approve — release seat</button>
                  <button class="btn-danger" data-reject="${r.id}" style="flex:1; border-radius:var(--radius-sm); padding:10px;">Reject</button>
                </div>
              </div>`;
            }).join('');
            return `<div class="section-title">Change Requests (${pending.length})</div>${rows}`;
        }

        function renderVoteHistorySection() {
            if (voteHistory.length === 0) {
                return `<div class="section-title">Voting History (this week)</div><div class="empty">No archived votes yet — this fills in each night at 7pm and resets every Monday.</div>`;
            }
            const groups = {};
            voteHistory.forEach(row => {
                const day = new Date(Number(row.archived_at)).toLocaleDateString('en-ZA', { timeZone: 'Africa/Johannesburg',
                    weekday: 'short', day: 'numeric', month: 'short' });
                (groups[day] = groups[day] || []).push(row);
            });
            const dayBlocks = Object.entries(groups).map(([day, rows]) => {
                const dirLabelFor = d => DIRECTIONS.find(x => x.id === d)?.label || d;
                const items = rows.map(r =>
                    `<div class="riders-item"><span>${escapeHtml(r.username)} <span style="color:var(--text-dimmer);">#${escapeHtml(r.student_id)}</span></span><span class="riders-meta">${dirLabelFor(r.direction)} · ${escapeHtml(r.slot_time)}</span></div>`
                ).join('');
                return `
              <div class="admin-slot-block">
                <div style="padding:10px 0 4px; font-family:var(--sans); font-size:10px; color:var(--text-dim); letter-spacing:1.2px; text-transform:uppercase; font-weight:600;">${day} · ${rows.length} vote${rows.length===1?'':'s'}</div>
                <div class="riders-panel admin">${items}</div>
              </div>`;
            }).join('');
            return `<div class="section-title">Voting History (this week · ${voteHistory.length} total)</div>${dayBlocks}`;
        }

        // ─── Bind functions ───────────────────────────────────────────────────
        function bindGate() {
            document.querySelectorAll('[data-gate-mode]').forEach(t => {
                t.addEventListener('click', () => { gateMode = t.dataset.gateMode;
                    render(); });
            });
            document.getElementById('adminLink').addEventListener('click', openAdminGate);

            if (gateMode === 'login') {
                const idInp = document.getElementById('loginId');
                const pwInp = document.getElementById('loginPw');
                const btn = document.getElementById('loginBtn');
                idInp.addEventListener('input', () => sanitizeStudentIdInput(idInp));
                document.getElementById('forgotPwEmailLink').addEventListener('click', openForgotPasswordEmailModal);

                async function doLogin() {
                    const id = idInp.value.trim();
                    const pw = pwInp.value;
                    if (!isValidStudentId(id)) { showToast('Enter a valid student number'); return; }
                    if (!pw) { showToast('Enter your password'); return; }
                    btn.disabled = true;
                    btn.textContent = 'Checking…';
                    try {
                        const data = await api('/auth/login', { method: 'POST', body: JSON.stringify({ studentId: id,
                                password: pw }) });
                        studentToken = data.token;
                        role = 'student';
                        studentId = data.studentId;
                        currentUsername = data.username;
                        await loadBoardData();
                        view = 'board';
                        render();
                    } catch (err) { showToast(err.message); } finally { btn.disabled = false;
                        btn.textContent = 'Log In'; }
                }
                btn.addEventListener('click', doLogin);
                pwInp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
            } else {
                const idInp = document.getElementById('suId');
                const nameInp = document.getElementById('suName');
                const emailInp = document.getElementById('suEmail');
                const pwInp = document.getElementById('suPw');
                const pw2Inp = document.getElementById('suPw2');
                const btn = document.getElementById('signupBtn');
                idInp.addEventListener('input', () => sanitizeStudentIdInput(idInp));

                async function doSignup() {
                    const id = idInp.value.trim();
                    const name = nameInp.value.trim();
                    const email = emailInp.value.trim();
                    const pw = pwInp.value;
                    const pw2 = pw2Inp.value;
                    if (!isValidStudentId(id)) { showToast('Enter a valid student number'); return; }
                    if (!name) { showToast('Enter a username (your real name)'); return; }
                    if (!email) { showToast('Enter your email — it\'s needed to reset your password'); return; }
                    if (pw.length < 4) { showToast('Password must be at least 4 characters'); return; }
                    if (pw !== pw2) { showToast('Passwords do not match'); return; }
                    btn.disabled = true;
                    btn.textContent = 'Creating…';
                    try {
                        const data = await api('/auth/signup', { method: 'POST', body: JSON.stringify({
                                studentId: id,
                                username: name,
                                password: pw,
                                email
                            }) });
                        studentToken = data.token;
                        role = 'student';
                        studentId = data.studentId;
                        currentUsername = data.username;
                        await loadBoardData();
                        view = 'board';
                        render();
                    } catch (err) { showToast(err.message); } finally { btn.disabled = false;
                        btn.textContent = 'Create Account'; }
                }
                btn.addEventListener('click', doSignup);
                pw2Inp.addEventListener('keydown', e => { if (e.key === 'Enter') doSignup(); });
            }
        }

        function bindBoard() {
            document.getElementById('switchId').addEventListener('click', () => {
                clearCountdown();
                clearClockTick();
                stopPolling();
                studentToken = null;
                studentId = '';
                currentUsername = '';
                role = null;
                gateMode = 'login';
                myVotes = [];
                myChangeRequests = [];
                ridersCache = {};
                view = 'gate';
                render();
            });
            document.querySelectorAll('.tab').forEach(t => {
                t.addEventListener('click', () => { activeDirection = t.dataset.dir;
                    render(); });
            });
            document.querySelectorAll('.slot-row[data-slot]').forEach(row => {
                row.addEventListener('click', () => requestBooking(row.dataset.slot));
            });
            document.querySelectorAll('[data-riders-toggle]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.ridersToggle;
                    if (expandedBoardSlots.has(id)) { expandedBoardSlots.delete(id);
                        render(false); } else {
                        expandedBoardSlots.add(id);
                        try { await refreshRiders(id); } catch (err) { showToast(err.message); }
                        render(false);
                    }
                });
            });
            document.getElementById('adminLink').addEventListener('click', openAdminGate);
            const reqBtn = document.getElementById('requestChangeBtn');
            if (reqBtn) reqBtn.addEventListener('click', openChangeRequestModal);
            const removeBtn = document.querySelector('[data-remove-booking]');
            if (removeBtn) removeBtn.addEventListener('click', confirmRemoveBooking);
            startCountdownIfNeeded();
            startClockTickIfNeeded();
            startPollingIfNeeded();
        }

        function bindAdmin() {
            document.getElementById('backLink').addEventListener('click', async () => {
                adminToken = null;
                if (studentToken) {
                    role = 'student';
                    try { await loadBoardData(); } catch (e) {}
                    view = 'board';
                } else {
                    role = null;
                    view = 'gate';
                }
                render();
            });
            document.querySelectorAll('[data-lightbox]').forEach(img => {
                img.addEventListener('click', () => {
                    const req = adminChangeRequests.find(r => r.id === img.dataset.lightbox);
                    if (req) openImageLightbox(req.image_data_url);
                });
            });
            document.querySelectorAll('[data-admin-riders-toggle]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.dataset.adminRidersToggle;
                    if (expandedAdminSlots.has(id)) { expandedAdminSlots.delete(id);
                        render(); } else {
                        expandedAdminSlots.add(id);
                        try { await refreshRiders(id); } catch (err) { showToast(err.message); }
                        render();
                    }
                });
            });
            document.querySelectorAll('input[data-field]').forEach(inp => {
                inp.addEventListener('change', async () => {
                    const id = inp.dataset.id,
                        field = inp.dataset.field;
                    const value = field === 'capacity' ? Math.max(1, parseInt(inp.value) || 1) : inp.value;
                    try {
                        await api(`/slots/${id}`, { method: 'PATCH', body: JSON.stringify({ [field]: value }) });
                        await refreshSlots();
                        showToast('Saved');
                        render();
                    } catch (err) { showToast(err.message); }
                });
            });
            document.querySelectorAll('[data-remove]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.remove;
                    showModal('Remove this slot?',
                        'Existing bookings for it will remain on record but the slot will disappear from the board.',
                        async () => {
                            closeModal();
                            try {
                                await api(`/slots/${id}`, { method: 'DELETE' });
                                await refreshSlots();
                            } catch (err) { showToast(err.message); }
                            render();
                        });
                });
            });
            document.querySelectorAll('[data-add]').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const dir = btn.dataset.add;
                    const timeInp = document.getElementById(`newTime_${dir}`);
                    const capInp = document.getElementById(`newCap_${dir}`);
                    const time = timeInp.value.trim();
                    if (!time) { showToast('Enter a time first'); return; }
                    const cap = Math.max(1, parseInt(capInp.value) || DEFAULT_CAPACITY);
                    try {
                        await api('/slots', { method: 'POST', body: JSON.stringify({ direction: dir,
                                time, capacity: cap }) });
                        await refreshSlots();
                        render();
                    } catch (err) { showToast(err.message); }
                });
            });
            document.getElementById('resetVotes').addEventListener('click', () => {
                showModal('Clear all bookings?', 'This clears every student booking across every slot. This cannot be undone.',
                    async () => {
                        closeModal();
                        try {
                            await api('/votes', { method: 'DELETE' });
                            await refreshSlots();
                            showToast('All bookings cleared');
                        } catch (err) { showToast(err.message); }
                        render();
                    });
            });
            document.querySelectorAll('[data-approve]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.approve;
                    const req = adminChangeRequests.find(r => r.id === id);
                    if (!req) return;
                    const slotTime = slots.find(s => s.id === req.slot_id)?.time || '';
                    showModal('Approve this change request?',
                        `This releases student ${req.student_id}'s seat on the ${slotTime} slot. They'll be able to pick a new slot next time they open the board.`,
                        async () => {
                            closeModal();
                            try {
                                await api(`/change-requests/${id}/approve`, { method: 'POST' });
                                await Promise.all([refreshAdminChangeRequests(), refreshSlots()]);
                                showToast('Approved — seat released');
                            } catch (err) { showToast(err.message); }
                            render();
                        });
                });
            });
            document.querySelectorAll('[data-reject]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.reject;
                    showModal('Reject this request?', 'The student stays booked in their current slot.',
                        async () => {
                            closeModal();
                            try {
                                await api(`/change-requests/${id}/reject`, { method: 'POST' });
                                await refreshAdminChangeRequests();
                                showToast('Request rejected');
                            } catch (err) { showToast(err.message); }
                            render();
                        });
                });
            });
        }

        // ─── Modal / Toast / Lightbox ────────────────────────────────────────
        function openAdminGate() {
            showPromptModal('Enter admin password', 'Admin password', async (pw) => {
                if (!pw) return;
                try {
                    const data = await api('/auth/admin-login', { method: 'POST', body: JSON.stringify({ password: pw }) });
                    adminToken = data.token;
                    role = 'admin';
                    clearCountdown();
                    clearClockTick();
                    stopPolling();
                    await loadAdminData();
                    view = 'admin';
                    render();
                } catch (err) { showToast(err.message); }
            });
        }

        function openForgotPasswordEmailModal() {
            const div = document.createElement('div');
            div.className = 'overlay';
            div.id = 'overlay';
            div.innerHTML = `
            <div class="modal">
              <h3>Reset via email</h3>
              <p>Enter your student number. If your account has an email on file, we'll send a reset link to it. The link expires in 15 minutes.</p>
              <div class="field-label">Student Number</div>
              <input type="text" id="fpeId" placeholder="e.g. 220456789" autocomplete="off" autocapitalize="off"
                maxlength="${STUDENT_ID_MAXLEN}" style="margin-bottom:16px;">
              <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="sendResetLinkBtn" style="margin-top:0;">Send reset link</button>
              </div>
            </div>`;
            document.body.appendChild(div);
            const idInp = document.getElementById('fpeId');
            idInp.addEventListener('input', () => sanitizeStudentIdInput(idInp));
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('sendResetLinkBtn').addEventListener('click', async () => {
                const id = idInp.value.trim();
                if (!isValidStudentId(id)) { showToast('Enter a valid student number'); return; }
                const btn = document.getElementById('sendResetLinkBtn');
                btn.disabled = true;
                btn.textContent = 'Sending…';
                try {
                    const data = await api('/auth/forgot-password', { method: 'POST', body: JSON.stringify({ studentId: id }) });
                    closeModal();
                    showToast(data.message || 'If that account has an email on file, a reset link has been sent.');
                } catch (err) {
                    showToast(err.message);
                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Send reset link';
                }
            });
        }

        async function requestBooking(slotId) {
            const slot = slots.find(s => s.id === slotId);
            const existing = myVoteFor(activeDirection);
            const isSwitch = !!existing;
            const title = isSwitch ? `Switch to the ${slot.time} slot?` : `Book the ${slot.time} slot?`;
            const body = isSwitch ?
                `${DIRECTIONS.find(d=>d.id===activeDirection).label} · You can switch again any time, as long as the slot you want isn't full and its time hasn't passed.` :
                `${DIRECTIONS.find(d=>d.id===activeDirection).label} · You can switch to any other open slot any time — no need to wait.`;

            showModal(title, body, async () => {
                closeModal();
                try {
                    await api('/votes', { method: 'POST', body: JSON.stringify({ direction: activeDirection,
                            slotId }) });
                    await Promise.all([refreshSlots(), refreshMyVotes()]);
                    showToast(`Booked: ${slot.time}`);
                } catch (err) { showToast(err.message); }
                render();
            });
        }

        function confirmRemoveBooking() {
            const myVote = myVoteFor(activeDirection);
            if (!myVote) return;
            const bookedTime = slots.find(s => s.id === myVote.slotId)?.time || '';
            const div = document.createElement('div');
            div.className = 'overlay';
            div.id = 'overlay';
            div.innerHTML = `
            <div class="modal">
              <h3>Remove your booking?</h3>
              <p>This frees up your seat on the <b>${escapeHtml(bookedTime)}</b> slot (${DIRECTIONS.find(d=>d.id===activeDirection).label}). You can always book another open slot later.</p>
              <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button class="btn btn-outline-red" id="confirmRemoveBtn" style="margin-top:0;">Remove booking</button>
              </div>
            </div>`;
            document.body.appendChild(div);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('confirmRemoveBtn').addEventListener('click', async () => {
                closeModal();
                try {
                    await api(`/votes/mine/${activeDirection}`, { method: 'DELETE' });
                    await Promise.all([refreshSlots(), refreshMyVotes(), refreshMyChangeRequests()]);
                    showToast('Booking removed');
                } catch (err) { showToast(err.message); }
                render();
            });
        }

        function openChangeRequestModal() {
            const div = document.createElement('div');
            div.className = 'overlay';
            div.id = 'overlay';
            div.innerHTML = `
            <div class="modal">
              <h3>Request a change</h3>
              <p>Upload proof — e.g. a screenshot of the email or message showing your schedule changed. Admin will review it and, if approved, release your current seat so you can pick a new slot.</p>
              <div class="field-label" style="margin-top:6px;">Proof (screenshot)</div>
              <input type="file" accept="image/*" id="proofFile" style="width:100%;margin:6px 0 14px;color:var(--text);font-size:13px;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;" />
              <div class="field-label">Note (optional)</div>
              <input type="text" id="proofNote" placeholder="e.g. Class moved to 12:00" style="margin-top:6px;margin-bottom:16px;" />
              <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="submitReqBtn">Send to admin</button>
              </div>
            </div>`;
            document.body.appendChild(div);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('submitReqBtn').addEventListener('click', submitChangeRequest);
        }

        function submitChangeRequest() {
            const fileInput = document.getElementById('proofFile');
            const note = document.getElementById('proofNote').value.trim();
            const file = fileInput.files[0];
            if (!file) { showToast('Please attach a screenshot first'); return; }
            if (file.size > 4 * 1024 * 1024) { showToast('That image is too large — try a smaller screenshot'); return; }
            const submitBtn = document.getElementById('submitReqBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending…';
            const reader = new FileReader();
            reader.onload = async () => {
                const imageDataUrl = reader.result;
                try {
                    await api('/change-requests', { method: 'POST', body: JSON.stringify({ direction: activeDirection,
                            imageDataUrl, note }) });
                    await refreshMyChangeRequests();
                    closeModal();
                    showToast('Request sent — admin will review it.');
                    render();
                } catch (err) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send to admin';
                    showToast(err.message);
                }
            };
            reader.onerror = () => { showToast('Could not read that file — try again.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send to admin'; };
            reader.readAsDataURL(file);
        }

        function openImageLightbox(url) {
            const div = document.createElement('div');
            div.className = 'lightbox-overlay';
            div.innerHTML = `<img src="${url}" />`;
            div.addEventListener('click', () => div.remove());
            document.body.appendChild(div);
        }

        function showModal(title, body, onConfirm) {
            const div = document.createElement('div');
            div.className = 'overlay';
            div.id = 'overlay';
            div.innerHTML = `
            <div class="modal">
              <h3>${title}</h3>
              <p>${body}</p>
              <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="confirmBtn">Confirm</button>
              </div>
            </div>`;
            document.body.appendChild(div);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('confirmBtn').addEventListener('click', onConfirm);
        }

        function closeModal() { const o = document.getElementById('overlay'); if (o) o.remove(); }

        function showPromptModal(title, placeholder, onSubmit) {
            const div = document.createElement('div');
            div.className = 'overlay';
            div.id = 'overlay';
            div.innerHTML = `
            <div class="modal">
              <h3>${title}</h3>
              <input type="password" id="promptInput" placeholder="${placeholder}"
                style="width:100%;padding:12px;font-size:16px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
                background:rgba(0,0,0,0.5);backdrop-filter:blur(8px);color:var(--text);margin-bottom:16px;font-family:var(--sans);" />
              <div class="modal-actions">
                <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="submitBtn">Submit</button>
              </div>
            </div>`;
            document.body.appendChild(div);
            const inp = document.getElementById('promptInput');
            setTimeout(() => inp.focus(), 50);
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('submitBtn').addEventListener('click', submit);
            inp.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

            function submit() { const val = inp.value;
                closeModal();
                onSubmit(val); }
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2600);
        }

        // ─── Init ──────────────────────────────────────────────────────────────
        (function init() {
            const params = new URLSearchParams(window.location.search);
            const tokenFromUrl = params.get('resetToken');
            const studentIdFromUrl = params.get('studentId');
            if (tokenFromUrl && studentIdFromUrl) {
                pendingResetToken = tokenFromUrl;
                pendingResetStudentId = studentIdFromUrl.toUpperCase();
                view = 'reset-token';
            }
            render();
        })();
    </script>
</body>
</html>
