<style>
  :root{
    --bg:#0b0c07;
    --panel:#141509;
    --panel-2:#1b1c10;
    --plate:#0e0f09;
    --line:#2b2c1c;
    --line-soft:#1f2013;
    --amber:#ffb400;
    --amber-dim:#6b5220;
    --amber-wash:rgba(255,180,0,.08);
    --green:#38d97f;
    --green-dim:#1a3d29;
    --green-wash:rgba(56,217,127,.08);
    --red:#ff5c4c;
    --red-dim:#42221c;
    --red-wash:rgba(255,92,76,.07);
    --text:#f3f0e3;
    --text-dim:#89897a;
    --text-dimmer:#5b5c4d;
    --mono:'DM Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    display:flex; justify-content:center;
  }
  #app{ width:100%; max-width:460px; min-height:100vh; display:flex; flex-direction:column; position:relative; }
  @media (min-width:760px){ #app{ max-width:820px; } }
  @media (min-width:1180px){ #app{ max-width:1160px; } }
  #app::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--amber) 20%, var(--amber) 80%, transparent);
    opacity:.6;
  }
  header{ padding:22px 18px 16px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, #121307, var(--bg)); }
  @media (min-width:760px){ header{ padding:30px 34px 22px; } header h1{ font-size:30px; } header .sub{ font-size:14.5px; } }
  .board-id{ display:flex; align-items:center; gap:7px; margin-bottom:10px; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--amber); box-shadow:0 0 6px 1px rgba(255,180,0,.7); }
  @media (prefers-reduced-motion: no-preference){ .live-dot{ animation:dotPulse 2.2s ease-in-out infinite; } }
  @keyframes dotPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .eyebrow{ font-family:var(--mono); font-size:10.5px; letter-spacing:3px; color:var(--amber); text-transform:uppercase; }
  h1{ margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; }
  .sub{ color:var(--text-dim); font-size:13px; margin-top:5px; }
  .sync-line{ display:flex; align-items:center; gap:6px; margin-top:9px; font-family:var(--mono); font-size:10.5px; color:var(--text-dimmer); letter-spacing:.5px; }
  .sync-line .live-dot{ width:5px; height:5px; }
  main{ flex:1; padding:16px; padding-bottom:90px; }
  @media (min-width:760px){ main{ padding:26px 34px 100px; } }
  @media (min-width:760px){ .gate, .board, .stats-bar, .locked-banner, .admin-metrics, .admin-add{ max-width:720px; } }
  @media (min-width:1180px){ .gate, .board, .stats-bar, .locked-banner, .admin-metrics, .admin-add{ max-width:900px; } }
  .stats-bar{ display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); }
  .stats-bar span:first-child{ white-space:nowrap; text-transform:uppercase; letter-spacing:1px; }
  .stats-track{ flex:1; height:4px; background:var(--line-soft); border-radius:2px; overflow:hidden; }
  .stats-fill{ height:100%; background:var(--amber); border-radius:2px; transition:width .6s ease; }
  .stats-num{ color:var(--amber); font-weight:500; white-space:nowrap; }
  .gate{ margin-top:26px; }
  .field-label{ font-family:var(--mono); font-size:10.5px; letter-spacing:2px; color:var(--text-dim); margin-bottom:8px; text-transform:uppercase;}
  input[type=text], input[type=password]{ width:100%; padding:14px 12px; font-size:16px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); font-family:var(--mono); letter-spacing:1px; box-sizing:border-box; }
  input[type=text]:focus, input[type=password]:focus{ outline:none; border-color:var(--amber); }
  .btn{ width:100%; padding:14px; border-radius:6px; border:none; margin-top:14px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--sans); letter-spacing:.2px; }
  .btn-primary{ background:var(--amber); color:#1a1206; }
  .btn-primary:disabled{ background:#3a3226; color:#6b6152; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--text-dim); border:1px solid var(--line); }
  .btn-outline-red{ background:transparent; color:var(--red); border:1px solid var(--red-dim); }
  .gate-note{ margin-top:22px; padding:12px 14px; border-radius:6px; background:var(--panel); border:1px dashed var(--line); font-size:12px; color:var(--text-dim); line-height:1.5; }
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab{ flex:1; padding:10px 8px; text-align:center; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; font-family:var(--mono); letter-spacing:1px; text-transform:uppercase; transition:transform .1s, background .15s; }
  .tab.active{ background:var(--amber-wash); color:var(--amber); border-color:var(--amber-dim); }
  .tab:active{ transform:scale(.97); }
  .id-chip{ display:flex; align-items:center; justify-content:space-between; font-family:var(--mono); font-size:11.5px; color:var(--text-dim); padding:9px 11px; background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:16px; letter-spacing:.5px; }
  .id-chip span b{ color:var(--text); }
  .id-chip button{ background:none; border:none; color:var(--amber); font-size:11px; cursor:pointer; font-family:var(--sans); font-weight:600;}
  .board{ border:1px solid var(--line); border-radius:8px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(0,0,0,.3); }
  .board-head{ display:grid; grid-template-columns:96px 1fr 96px; padding:9px 12px; background:var(--panel-2); border-bottom:1px solid var(--line); font-family:var(--mono); font-size:9.5px; letter-spacing:2px; color:var(--text-dimmer); text-transform:uppercase; }
  .board-head span:last-child{ text-align:right; }
  .slot-wrap{ border-bottom:1px solid var(--line-soft); }
  .slot-wrap:last-child{ border-bottom:none; }
  .slot-row{ display:grid; grid-template-columns:96px 1fr 96px; align-items:center; padding:13px 12px; background:var(--panel); cursor:pointer; transition:background .15s, transform .1s; position:relative; }
  .riders-toggle{ display:block; width:100%; text-align:left; background:var(--panel-2); border:none; border-top:1px dashed var(--line-soft); color:var(--text-dim); font-family:var(--mono); font-size:10px; letter-spacing:1px; text-transform:uppercase; padding:7px 12px; cursor:pointer; }
  .riders-toggle:hover{ color:var(--amber); }
  .riders-panel{ background:var(--plate); padding:8px 12px 10px; }
  .riders-panel.admin{ padding:8px 0 10px; }
  .riders-item{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:11.5px; color:var(--text); padding:5px 0; border-bottom:1px solid var(--line-soft); }
  .riders-item:last-child{ border-bottom:none; }
  .riders-meta{ color:var(--text-dimmer); font-size:10px; white-space:nowrap; }
  .riders-you{ color:var(--amber); font-weight:600; }
  .riders-empty{ color:var(--text-dimmer); font-size:11.5px; font-family:var(--mono); padding:6px 0; }
  .slot-row:active{ background:var(--panel-2); transform:scale(.985); }
  .slot-row.full{ cursor:not-allowed; opacity:0.5; }
  .slot-row.passed{ cursor:not-allowed; opacity:0.4; }
  .slot-row.mine{ background:var(--green-wash); }
  .slot-meta{ font-size:11.5px; color:var(--text-dim); font-family:var(--mono); }
  .slot-status{ text-align:right; }
  .occupancy{ margin-top:6px; height:3px; width:100%; max-width:120px; border-radius:2px; background:var(--line-soft); overflow:hidden; }
  .occupancy-fill{ height:100%; border-radius:2px; transition:width .6s ease; background:var(--green); }
  .occupancy-fill.low{ background:var(--amber); }
  .occupancy-fill.full{ background:var(--red); }
  @media (prefers-reduced-motion: no-preference){ .row-flash{ animation:rowFlash 1.2s ease; } }
  @keyframes rowFlash{ 0%{ box-shadow:inset 0 0 0 999px var(--amber-wash); } 100%{ box-shadow:inset 0 0 0 999px rgba(0,0,0,0); } }
  .flap-time{ display:flex; gap:3px; }
  .flap-char{ width:18px; height:29px; border-radius:3px; background:var(--plate); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:500; font-size:18px; color:var(--amber); box-shadow:inset 0 0 0 1px var(--line); position:relative; overflow:hidden; }
  .flap-char::after{ content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.55); transform:translateY(-.5px); }
  .flap-char.colon{ background:transparent; box-shadow:none; width:7px; color:var(--text-dimmer); font-size:14px; }
  @media (prefers-reduced-motion: no-preference){ .flap-char.flap-anim{ animation:flapReveal .4s cubic-bezier(.2,.65,.3,1) both; transform-origin:50% 50%; } }
  @keyframes flapReveal{ 0%{ transform:rotateX(-95deg); opacity:0; } 55%{ transform:rotateX(12deg); opacity:1; } 100%{ transform:rotateX(0deg); } }
  .tag{ display:inline-flex; align-items:center; padding:4px 8px; border-radius:4px; font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:1px; border:1px solid; text-transform:uppercase; white-space:nowrap; }
  .tag-open{ color:var(--green); border-color:var(--green-dim); background:var(--green-wash); }
  .tag-low{ color:var(--amber); border-color:var(--amber-dim); background:var(--amber-wash); }
  @media (prefers-reduced-motion: no-preference){ .tag-low{ animation:tagPulse 1.7s ease-in-out infinite; } }
  @keyframes tagPulse{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .tag-full{ color:var(--red); border-color:var(--red-dim); background:var(--red-wash); }
  .tag-mine{ color:var(--green); border-color:var(--green); background:rgba(56,217,127,.14); }
  .tag-dim{ color:var(--text-dimmer); border-color:var(--line); background:transparent; }
  .locked-banner{ margin-top:14px; padding:13px 14px; border-radius:8px; background:var(--green-wash); border:1px solid var(--green-dim); font-size:13px; color:var(--green); display:flex; gap:10px; align-items:flex-start; line-height:1.5; }
  .locked-banner.amber{ background:var(--amber-wash); border-color:var(--amber-dim); color:var(--amber); }
  .locked-banner.blue{ background:rgba(90,150,220,.08); border-color:#2d4d6e; color:#8fb8e6; }
  .locked-banner .banner-icon{ font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.5px; border:1px solid currentColor; border-radius:4px; padding:2px 5px; flex-shrink:0; margin-top:1px; }
  .locked-banner .banner-body{ flex:1; color:var(--text); }
  .locked-banner .banner-body b{ color:inherit; }
  .banner-actions{ display:flex; gap:8px; margin-top:10px; }
  .banner-actions .btn{ margin-top:0; padding:9px 12px; font-size:12px; }
  .section-title{ font-family:var(--mono); font-size:10.5px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin:22px 0 10px; }
  .empty{ color:var(--text-dim); font-size:13px; padding:24px 4px; text-align:center; font-family:var(--mono); }
  .overlay{ position:fixed; inset:0; background:rgba(6,7,4,0.78); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
  @media (min-width:760px){ .overlay{ align-items:center; } }
  .modal{ width:100%; max-width:460px; background:var(--panel-2); border-radius:14px 14px 0 0; padding:22px 20px 26px; border-top:1px solid var(--line); }
  @media (min-width:760px){ .modal{ border-radius:14px; border:1px solid var(--line); } }
  .modal h3{ margin:0 0 6px; font-size:16px; font-weight:700; }
  .modal p{ color:var(--text-dim); font-size:13px; line-height:1.55; margin:0 0 18px; }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions .btn{ margin-top:0; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel-2); border:1px solid var(--line); color:var(--text); padding:10px 16px; border-radius:6px; font-size:13px; z-index:60; max-width:90%; text-align:center; font-family:var(--mono); }
  @media (prefers-reduced-motion: no-preference){ .toast{ animation:toastIn .25s ease; } }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,8px); } to{ opacity:1; transform:translate(-50%,0); } }
  footer{ padding:14px 18px; border-top:1px solid var(--line); text-align:center; }
  .admin-link{ color:var(--text-dimmer); font-size:10.5px; font-family:var(--mono); letter-spacing:1.5px; cursor:pointer; text-transform:uppercase; }
  .admin-link:hover{ color:var(--text-dim); }
  .admin-metrics{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .metric-card{ background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 14px 12px; position:relative; overflow:hidden; }
  .metric-card::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .metric-card.campus::before{ background:var(--amber); }
  .metric-card.residence::before{ background:var(--green); }
  .metric-label{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase; margin-bottom:8px; }
  .metric-dot{ width:6px; height:6px; border-radius:50%; }
  .metric-card.campus .metric-dot{ background:var(--amber); }
  .metric-card.residence .metric-dot{ background:var(--green); }
  .metric-value{ font-family:var(--mono); font-size:30px; font-weight:500; line-height:1; color:var(--text); }
  .metric-card.campus .metric-value{ color:var(--amber); }
  .metric-card.residence .metric-value{ color:var(--green); }
  .metric-sub{ font-size:11px; color:var(--text-dimmer); margin-top:6px; font-family:var(--mono); }
  .admin-slot-block{ border-bottom:1px solid var(--line-soft); }
  .admin-slot-block:last-child{ border-bottom:none; }
  .cr-card{ border:1px solid var(--amber-dim); background:var(--amber-wash); border-radius:8px; padding:14px; margin-bottom:12px; }
  .cr-card:last-child{ margin-bottom:0; }
  .cr-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .cr-meta{ font-size:12px; color:var(--text-dim); line-height:1.5; }
  .cr-note{ margin-top:4px; color:var(--text); }
  .cr-thumb-wrap{ display:flex; justify-content:center; background:var(--plate); border-radius:6px; border:1px solid var(--line); padding:6px; margin-bottom:10px; }
  .cr-thumb{ max-width:100%; max-height:220px; object-fit:contain; border-radius:4px; cursor:zoom-in; display:block; }
  .lightbox-overlay{ position:fixed; inset:0; background:rgba(6,7,4,.92); display:flex; align-items:center; justify-content:center; z-index:70; padding:24px; cursor:zoom-out; }
  .lightbox-overlay img{ max-width:100%; max-height:100%; border-radius:8px; box-shadow:0 0 0 1px var(--line); }
  .admin-row{ display:flex; gap:8px; align-items:center; padding:10px 0; }
  .admin-row input{ padding:8px; font-size:13px; }
  .admin-row .btn-danger{ background:var(--red-dim); color:var(--red); border:none; padding:8px 10px; border-radius:6px; font-size:11px; cursor:pointer; font-family:var(--sans); font-weight:600;}
  .admin-add{ display:grid; grid-template-columns:1fr 1fr 70px; gap:8px; margin-top:14px; }
  .admin-add .btn{ margin-top:0; grid-column:1/4; }
  .loading{ text-align:center; padding:60px 20px; color:var(--text-dim); font-family:var(--mono); font-size:13px;}
  .dev-credit{ margin-top:6px; font-family:var(--mono); font-size:9px; color:var(--text-dimmer); letter-spacing:1px; }
</style>

<body>
<div id="app"><div class="loading">Loading board…</div></div>

<script>

// Points at your live Render backend by default.
// If you happen to load this page from localhost (e.g. testing with `node src/server.js` running locally),
// it automatically falls back to your local API instead, so you don't have to edit this by hand.
const PROD_API_BASE = 'https://transport-voting.onrender.com/api';
const LOCAL_API_BASE = 'http://localhost:4000/api';
const isLocalHost = ['localhost', '127.0.0.1', ''].includes(window.location.hostname);
const API_BASE = isLocalHost ? LOCAL_API_BASE : PROD_API_BASE;

const DIRECTIONS = [
  { id:'to_campus', label:'To Campus' },
  { id:'to_residence', label:'To Residence' }
];
const DEFAULT_CAPACITY = 13;
const CHANGE_WINDOW_MS = 10 * 60 * 1000;
// Student numbers must end with this suffix (e.g. "220456789@RSM"). Only
// students who've been told to add it can register or log in — it's a
// shared code, not tied to any real student-number format.
const STUDENT_ID_DIGITS = 9;
const STUDENT_ID_SUFFIX = '@RSM';
const STUDENT_ID_MAXLEN = STUDENT_ID_DIGITS + STUDENT_ID_SUFFIX.length;
// Slots are specific departure times today. Once a slot's time has gone
// by, it can no longer be booked or switched to — mirrors the server's
// own check, purely so the UI can show "Passed" immediately rather than
// waiting for a rejected request. The server is the real enforcement.
const SLOT_TIMEZONE = 'Africa/Johannesburg';

let studentToken = null, studentId = '', currentUsername = '';
let adminToken = null;
let role = null;
let gateMode = 'login';
let activeDirection = 'to_campus';
let view = 'gate';
let slots = [];
let myVotes = [];
let myChangeRequests = [];
let adminChangeRequests = [];
let voteHistory = [];
let ridersCache = {};
let countdownTimer = null;
let pollTimer = null;
let syncTickTimer = null;
let clockTickTimer = null;
let lastSyncedAt = Date.now();
let lastSnapshot = null;
let expandedBoardSlots = new Set();
let expandedAdminSlots = new Set();

function activeToken(){ return role === 'admin' ? adminToken : studentToken; }
async function api(path, options = {}) {
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  const token = activeToken();
  if (token) headers.Authorization = `Bearer ${token}`;
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  let body = null;
  try { body = await res.json(); } catch (e) {}
  if (!res.ok) throw new Error((body && body.error) || `Request failed (${res.status})`);
  return body;
}

function normalizeVote(v){ return { direction: v.direction, slotId: v.slot_id, ts: Number(v.ts), originalTs: Number(v.original_ts) }; }
async function refreshSlots(){ slots = await api('/slots'); }
async function refreshMyVotes(){
  if (role !== 'student') { myVotes = []; return; }
  const rows = await api('/votes/mine');
  myVotes = rows.map(normalizeVote);
}
async function refreshMyChangeRequests(){
  if (role !== 'student') { myChangeRequests = []; return; }
  myChangeRequests = await api('/change-requests/mine');
}
async function refreshAdminChangeRequests(){ adminChangeRequests = await api('/change-requests'); }
async function refreshVoteHistory(){ voteHistory = await api('/history'); }
async function refreshRiders(slotId){ ridersCache[slotId] = await api(`/votes/slot/${slotId}`); return ridersCache[slotId]; }
async function loadBoardData(){ await Promise.all([refreshSlots(), refreshMyVotes(), refreshMyChangeRequests()]); }
async function loadAdminData(){ await Promise.all([refreshSlots(), refreshAdminChangeRequests(), refreshVoteHistory()]); }

function isEditable(vote){ return (Date.now() - vote.originalTs) < CHANGE_WINDOW_MS; }
function msRemaining(vote){ return Math.max(0, CHANGE_WINDOW_MS - (Date.now() - vote.originalTs)); }
function myVoteFor(direction){ return myVotes.find(v => v.direction === direction); }
function fmtRemaining(ms){
  const totalSec = Math.ceil(ms/1000);
  const mm = Math.floor(totalSec/60), ss = totalSec%60;
  return `${mm}:${ss.toString().padStart(2,'0')}`;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Minutes since midnight, in Africa/Johannesburg, regardless of the
// device's own timezone/locale settings.
function nowMinutesSAST(){
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: SLOT_TIMEZONE, hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const hour = parseInt(parts.find(p => p.type === 'hour').value, 10);
  const minute = parseInt(parts.find(p => p.type === 'minute').value, 10);
  return hour * 60 + minute;
}
function slotMinutes(timeStr){
  const [h, m] = String(timeStr).split(':').map(Number);
  return (h||0) * 60 + (m||0);
}
function hasSlotPassed(timeStr){
  return slotMinutes(timeStr) <= nowMinutesSAST();
}

function sanitizeStudentIdInput(inputEl){
  // Keep only digits and the letters/@ needed to type the suffix, and
  // uppercase it so "@rsm" becomes "@RSM" as the person types.
  const cleaned = inputEl.value.toUpperCase().replace(/[^0-9@RSM]/g, '').slice(0, STUDENT_ID_MAXLEN);
  if (inputEl.value !== cleaned) inputEl.value = cleaned;
}
function isValidStudentId(id){ return new RegExp(`^\\d{${STUDENT_ID_DIGITS}}${STUDENT_ID_SUFFIX}$`).test(id); }

function startCountdownIfNeeded(){
  clearCountdown();
  const myVote = myVoteFor(activeDirection);
  if(view==='board' && myVote && isEditable(myVote)){
    countdownTimer = setInterval(()=>{ render(false); }, 1000);
  }
}
function clearCountdown(){ if(countdownTimer){ clearInterval(countdownTimer); countdownTimer=null; } }

function startClockTickIfNeeded(){
  clearClockTick();
  if(view==='board'){
    // Re-render once a minute so slots automatically flip to "Passed"
    // as the clock ticks past their time, without needing a refresh.
    clockTickTimer = setInterval(()=>{ render(false); }, 60000);
  }
}
function clearClockTick(){ if(clockTickTimer){ clearInterval(clockTickTimer); clockTickTimer=null; } }

function snapshotTaken(){
  const m = {};
  slots.forEach(s=>{ m[s.id] = s.taken; });
  return m;
}
function checkSlotOpenings(oldSnap, newSnap){
  if(!oldSnap) return;
  slots.forEach(slot=>{
    const wasFull = (oldSnap[slot.id] ?? 0) >= slot.capacity;
    const isFullNow = (newSnap[slot.id] ?? 0) >= slot.capacity;
    if(wasFull && !isFullNow){
      const myVote = myVoteFor(slot.direction);
      if(myVote && myVote.slotId !== slot.id){
        const dirLabel = DIRECTIONS.find(d=>d.id===slot.direction)?.label || slot.direction;
        showToast(`Seat opened up at ${slot.time} (${dirLabel}) — tap it to switch.`);
      }
    }
  });
}
function startPollingIfNeeded(){
  stopPolling();
  if(view!=='board') return;
  lastSnapshot = snapshotTaken();
  lastSyncedAt = Date.now();
  pollTimer = setInterval(async ()=>{
    if(document.getElementById('overlay')) return;
    try{ await loadBoardData(); }catch(e){ return; }
    lastSyncedAt = Date.now();
    const newSnap = snapshotTaken();
    const changed = new Set();
    Object.keys(newSnap).forEach(id=>{
      if(!lastSnapshot || newSnap[id] !== lastSnapshot[id]) changed.add(id);
    });
    checkSlotOpenings(lastSnapshot, newSnap);
    lastSnapshot = newSnap;
    if(view==='board') render(false, changed);
  }, 5000);
  syncTickTimer = setInterval(updateSyncTicker, 1000);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer=null; }
  if(syncTickTimer){ clearInterval(syncTickTimer); syncTickTimer=null; }
}
function updateSyncTicker(){
  const el = document.getElementById('syncTicker');
  if(!el) return;
  const secs = Math.max(0, Math.round((Date.now()-lastSyncedAt)/1000));
  el.textContent = secs<2 ? 'Live · synced just now' : `Live · synced ${secs}s ago`;
}

function flapMarkup(str, animate){
  return `<div class="flap-time">${[...String(str)].map((ch,i)=>{
    if(ch===':') return `<span class="flap-char colon">:</span>`;
    const delayAttr = animate ? ` flap-anim" style="animation-delay:${i*45}ms` : '"';
    return `<span class="flap-char${delayAttr}>${escapeHtml(ch)}</span>`;
  }).join('')}</div>`;
}

function render(animate, changedIds){
  if(animate===undefined) animate = true;
  const app = document.getElementById('app');
  if(view==='gate'){ stopPolling(); clearClockTick(); app.innerHTML = renderGate(); bindGate(); return; }
  if(view==='admin'){ stopPolling(); clearClockTick(); app.innerHTML = renderAdmin(); bindAdmin(); return; }
  app.innerHTML = renderBoard(animate, changedIds || new Set()); bindBoard();
}

function statusFor(slot){
  const taken = slot.taken || 0;
  const remaining = slot.capacity - taken;
  const myVote = myVoteFor(slot.direction);
  const mine = (myVote && myVote.slotId === slot.id) ? myVote : null;
  return { taken, remaining, full: remaining<=0, mine };
}

function renderBoard(animate, changedIds){
  changedIds = changedIds || new Set();
  const dirSlots = slots.filter(s=>s.direction===activeDirection).sort((a,b)=>a.time.localeCompare(b.time));
  const myVote = myVoteFor(activeDirection);
  const editable = myVote ? isEditable(myVote) : false;

  let totalTaken = 0, totalCap = 0;
  dirSlots.forEach(s=>{ totalTaken += (s.taken||0); totalCap += s.capacity; });
  const fillPct = totalCap ? Math.round((totalTaken/totalCap)*100) : 0;
  const statsBar = dirSlots.length ? `
    <div class="stats-bar">
      <span>${DIRECTIONS.find(d=>d.id===activeDirection).label} full</span>
      <div class="stats-track"><div class="stats-fill" style="width:${fillPct}%"></div></div>
      <span class="stats-num">${totalTaken}/${totalCap}</span>
    </div>` : '';

  let rows = '';
  if(dirSlots.length===0){
    rows = `<div class="empty">No slots set up for this direction yet.</div>`;
  } else {
    rows = dirSlots.map(slot=>{
      const st = statusFor(slot);
      const passed = hasSlotPassed(slot.time) && !st.mine;
      let statusHtml, rowClass='';
      if(st.mine){
        statusHtml = editable ? `<span class="tag tag-mine">Yours</span>` : `<span class="tag tag-mine">Locked</span>`;
        rowClass = 'mine';
      } else if(st.full){
        statusHtml = `<span class="tag tag-full">Full</span>`;
        rowClass = 'full';
      } else if(passed){
        statusHtml = `<span class="tag tag-dim">Passed</span>`;
        rowClass = 'passed';
      } else if(st.remaining<=3){
        statusHtml = `<span class="tag tag-low">${st.remaining} left</span>`;
      } else {
        statusHtml = `<span class="tag tag-open">Open</span>`;
      }
      const clickable = !st.mine && !st.full && !passed;
      const pct = slot.capacity ? Math.min(100, Math.round((st.taken/slot.capacity)*100)) : 0;
      const barClass = st.full ? 'full' : (st.remaining<=3 ? 'low' : '');
      const flashClass = (!animate && changedIds.has(slot.id)) ? ' row-flash' : '';
      const expanded = expandedBoardSlots.has(slot.id);
      const riders = ridersCache[slot.id] || [];
      const ridersHtml = expanded ? `
        <div class="riders-panel">
          ${riders.length===0 ? `<div class="riders-empty">No one booked yet.</div>` : riders.map(v=>
            `<div class="riders-item"><span>${escapeHtml(v.username)}${v.student_id===studentId?' <span class="riders-you">(you)</span>':''}</span><span class="riders-meta">${new Date(Number(v.ts)).toLocaleString()}</span></div>`
          ).join('')}
        </div>` : '';
      return `
        <div class="slot-wrap">
          <div class="slot-row ${rowClass}${flashClass}" ${clickable?`data-slot="${slot.id}"`:''}>
            <div>${flapMarkup(slot.time, animate)}</div>
            <div>
              <div class="slot-meta">${st.taken}/${slot.capacity} booked</div>
              <div class="occupancy"><div class="occupancy-fill ${barClass}" style="width:${pct}%"></div></div>
            </div>
            <div class="slot-status">${statusHtml}</div>
          </div>
          <button class="riders-toggle" data-riders-toggle="${slot.id}" type="button">${expanded?'Hide':'See'} who's booked${st.taken?` (${st.taken})`:''}</button>
          ${ridersHtml}
        </div>`;
    }).join('');
  }

  let lockedBanner = '';
  const myPendingReq = myChangeRequests.find(r=>r.direction===activeDirection && r.status==='pending');
  const lastReq = myChangeRequests.filter(r=>r.direction===activeDirection).sort((a,b)=>b.ts-a.ts)[0];
  const removeBtnHtml = `<button class="btn btn-outline-red" data-remove-booking style="padding:9px 12px; font-size:12px;">Remove my booking</button>`;

  if(myVote && myPendingReq){
    const bookedTime = slots.find(s=>s.id===myVote.slotId)?.time || '';
    lockedBanner = `
      <div class="locked-banner blue">
        <div class="banner-icon">Sent</div>
        <div class="banner-body">
          You're booked for <b>${bookedTime}</b>. Your change request (with proof) has been sent to admin and is awaiting review.
          <div class="banner-actions">${removeBtnHtml}</div>
        </div>
      </div>`;
  } else if(myVote && editable){
    const bookedTime = slots.find(s=>s.id===myVote.slotId)?.time || '';
    lockedBanner = `
      <div class="locked-banner amber">
        <div class="banner-icon">${fmtRemaining(msRemaining(myVote))}</div>
        <div class="banner-body">
          Booked <b>${bookedTime}</b>. Tap any open slot below to switch — you can do this any time, even after this timer runs out, as long as the new slot's time hasn't passed and it isn't full.
          <div class="banner-actions">
            <button class="btn btn-ghost" id="requestChangeBtn" style="padding:9px 12px; font-size:12px;">Leave without picking a new slot (needs proof)</button>
            ${removeBtnHtml}
          </div>
        </div>
      </div>`;
  } else if(myVote && !editable){
    const bookedTime = slots.find(s=>s.id===myVote.slotId)?.time || '';
    lockedBanner = `
      <div class="locked-banner">
        <div class="banner-icon">Booked</div>
        <div class="banner-body">
          You're booked for <b>${bookedTime}</b> (${DIRECTIONS.find(d=>d.id===activeDirection).label}). You can switch to any open slot below, as long as its time hasn't passed yet — we'll notify you if one opens up.
          If every remaining slot is full and you need to leave without picking a new one, request a change with proof instead.
          <div class="banner-actions">
            <button class="btn btn-ghost" id="requestChangeBtn" style="padding:9px 12px; font-size:12px;">Request a change (upload proof)</button>
            ${removeBtnHtml}
          </div>
        </div>
      </div>`;
  } else if(!myVote && lastReq && lastReq.status==='approved'){
    lockedBanner = `
      <div class="locked-banner">
        <div class="banner-icon">Ok</div>
        <div class="banner-body">Your previous booking was released after admin review. Pick a new slot below.</div>
      </div>`;
  }

  return `
    <header>
      <div class="board-id"><span class="live-dot"></span><span class="eyebrow">RSM Student Accommodation</span></div>
      <h1>Transport Board</h1>
      <div class="sub">Pick a time slot. Slots close once their time has passed for today.</div>
      <div class="sync-line"><span class="live-dot"></span><span id="syncTicker">Live · synced just now</span></div>
    </header>
    <main>
      <div class="id-chip">
        <span><b>${escapeHtml(currentUsername || studentId)}</b> <span style="color:var(--text-dimmer); font-weight:400;">#${escapeHtml(studentId)}</span></span>
        <button id="switchId">Log Out</button>
      </div>
      <div class="tabs">
        ${DIRECTIONS.map(d=>`<div class="tab ${d.id===activeDirection?'active':''}" data-dir="${d.id}">${d.label}</div>`).join('')}
      </div>
      ${statsBar}
      <div class="board">
        <div class="board-head"><span>Time</span><span>Booked</span><span>Status</span></div>
        ${rows}
      </div>
      ${lockedBanner}
    </main>
    <footer>
      <span class="admin-link" id="adminLink">Admin</span>
      <div class="dev-credit">Developed by Kgapane Moenzi</div>
    </footer>
  `;
}

async function requestBooking(slotId){
  const slot = slots.find(s=>s.id===slotId);
  const existing = myVoteFor(activeDirection);
  const isSwitch = !!existing;
  const title = isSwitch ? `Switch to the ${slot.time} slot?` : `Book the ${slot.time} slot?`;
  const body = isSwitch
    ? `${DIRECTIONS.find(d=>d.id===activeDirection).label} · You can switch again any time, as long as the slot you want isn't full and its time hasn't passed.`
    : `${DIRECTIONS.find(d=>d.id===activeDirection).label} · You can switch to any other open slot any time — no need to wait.`;

  showModal(title, body, async ()=>{
    closeModal();
    try{
      await api('/votes', { method:'POST', body: JSON.stringify({ direction: activeDirection, slotId }) });
      await Promise.all([refreshSlots(), refreshMyVotes()]);
      showToast(`Booked: ${slot.time}`);
    }catch(err){
      showToast(err.message);
    }
    render();
  });
}

function confirmRemoveBooking(){
  const myVote = myVoteFor(activeDirection);
  if(!myVote) return;
  const bookedTime = slots.find(s=>s.id===myVote.slotId)?.time || '';
  const div = document.createElement('div');
  div.className='overlay'; div.id='overlay';
  div.innerHTML = `
    <div class="modal">
      <h3>Remove your booking?</h3>
      <p>This frees up your seat on the <b>${escapeHtml(bookedTime)}</b> slot (${DIRECTIONS.find(d=>d.id===activeDirection).label}). You can always book another open slot later.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-outline-red" id="confirmRemoveBtn" style="margin-top:0;">Remove booking</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('confirmRemoveBtn').addEventListener('click', async ()=>{
    closeModal();
    try{
      await api(`/votes/mine/${activeDirection}`, { method:'DELETE' });
      await Promise.all([refreshSlots(), refreshMyVotes(), refreshMyChangeRequests()]);
      showToast('Booking removed');
    }catch(err){
      showToast(err.message);
    }
    render();
  });
}

function openChangeRequestModal(){
  const div = document.createElement('div');
  div.className='overlay'; div.id='overlay';
  div.innerHTML = `
    <div class="modal">
      <h3>Request a change</h3>
      <p>Upload proof — e.g. a screenshot of the email or message showing your schedule changed. Admin will review it and, if approved, release your current seat so you can pick a new slot.</p>
      <div class="field-label">Proof (screenshot)</div>
      <input type="file" accept="image/*" id="proofFile" style="width:100%;margin:8px 0 14px;color:var(--text);font-size:13px;" />
      <div class="field-label">Note (optional)</div>
      <input type="text" id="proofNote" placeholder="e.g. Class moved to 12:00" style="margin-top:8px;margin-bottom:16px;" />
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="submitReqBtn">Send to admin</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('submitReqBtn').addEventListener('click', submitChangeRequest);
}

function submitChangeRequest(){
  const fileInput = document.getElementById('proofFile');
  const note = document.getElementById('proofNote').value.trim();
  const file = fileInput.files[0];
  if(!file){ showToast('Please attach a screenshot first'); return; }
  if(file.size > 4*1024*1024){ showToast('That image is too large — try a smaller screenshot'); return; }
  const submitBtn = document.getElementById('submitReqBtn');
  submitBtn.disabled = true; submitBtn.textContent = 'Sending…';
  const reader = new FileReader();
  reader.onload = async () => {
    const imageDataUrl = reader.result;
    try{
      await api('/change-requests', { method:'POST', body: JSON.stringify({ direction: activeDirection, imageDataUrl, note }) });
      await refreshMyChangeRequests();
      closeModal();
      showToast('Request sent — admin will review it.');
      render();
    }catch(err){
      submitBtn.disabled=false; submitBtn.textContent='Send to admin';
      showToast(err.message);
    }
  };
  reader.onerror = () => { showToast('Could not read that file — try again.'); submitBtn.disabled=false; submitBtn.textContent='Send to admin'; };
  reader.readAsDataURL(file);
}

function renderChangeRequestsSection(){
  const pending = adminChangeRequests.filter(r=>r.status==='pending');
  if(pending.length===0) return '';
  const rows = pending.map(r=>{
    const slot = slots.find(s=>s.id===r.slot_id);
    const dirLabel = DIRECTIONS.find(d=>d.id===r.direction)?.label || r.direction;
    return `
      <div class="cr-card">
        <div class="cr-head">
          <div class="cr-meta">
            <span>${escapeHtml(r.username)} <span style="color:var(--text-dimmer);">#${escapeHtml(r.student_id)}</span> · ${dirLabel} · currently ${slot ? slot.time : '—'}</span>
            ${r.note ? `<div class="cr-note">${escapeHtml(r.note)}</div>` : ''}
          </div>
          <span class="tag tag-low">Needs review</span>
        </div>
        <div class="cr-thumb-wrap">
          <img class="cr-thumb" src="${r.image_data_url}" data-lightbox="${r.id}" />
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" style="margin-top:0; flex:1; padding:10px;" data-approve="${r.id}">Approve — release seat</button>
          <button class="btn-danger" data-reject="${r.id}" style="flex:1; border-radius:6px; padding:10px;">Reject</button>
        </div>
      </div>`;
  }).join('');
  return `<div class="section-title">Change Requests (${pending.length})</div>${rows}`;
}

function renderVoteHistorySection(){
  if(voteHistory.length===0){
    return `<div class="section-title">Voting History (this week)</div><div class="empty">No archived votes yet — this fills in each night at 7pm and resets every Monday.</div>`;
  }
  // Group by the calendar day (South Africa time) the vote was archived on.
  const groups = {};
  voteHistory.forEach(row=>{
    const day = new Date(Number(row.archived_at)).toLocaleDateString('en-ZA', { timeZone:'Africa/Johannesburg', weekday:'short', day:'numeric', month:'short' });
    (groups[day] = groups[day] || []).push(row);
  });
  const dayBlocks = Object.entries(groups).map(([day, rows])=>{
    const dirLabelFor = d => DIRECTIONS.find(x=>x.id===d)?.label || d;
    const items = rows.map(r=>
      `<div class="riders-item"><span>${escapeHtml(r.username)} <span style="color:var(--text-dimmer);">#${escapeHtml(r.student_id)}</span></span><span class="riders-meta">${dirLabelFor(r.direction)} · ${escapeHtml(r.slot_time)}</span></div>`
    ).join('');
    return `
      <div class="admin-slot-block">
        <div style="padding:10px 0 4px; font-family:var(--mono); font-size:10.5px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase;">${day} · ${rows.length} vote${rows.length===1?'':'s'}</div>
        <div class="riders-panel admin">${items}</div>
      </div>`;
  }).join('');
  return `<div class="section-title">Voting History (this week · ${voteHistory.length} total)</div>${dayBlocks}`;
}

function renderAdmin(){
  const campusSlots = slots.filter(s=>s.direction==='to_campus');
  const residenceSlots = slots.filter(s=>s.direction==='to_residence');
  const campusTotal = campusSlots.reduce((sum,s)=>sum+(s.taken||0),0);
  const residenceTotal = residenceSlots.reduce((sum,s)=>sum+(s.taken||0),0);
  const campusCap = campusSlots.reduce((sum,s)=>sum+s.capacity,0);
  const residenceCap = residenceSlots.reduce((sum,s)=>sum+s.capacity,0);
  const metrics = `
    <div class="admin-metrics">
      <div class="metric-card campus">
        <div class="metric-label"><span class="metric-dot"></span>To Campus</div>
        <div class="metric-value">${campusTotal}</div>
        <div class="metric-sub">of ${campusCap} seats booked</div>
      </div>
      <div class="metric-card residence">
        <div class="metric-label"><span class="metric-dot"></span>To Residence</div>
        <div class="metric-value">${residenceTotal}</div>
        <div class="metric-sub">of ${residenceCap} seats booked</div>
      </div>
    </div>`;

  const groups = DIRECTIONS.map(dir=>{
    const dirSlots = slots.filter(s=>s.direction===dir.id).sort((a,b)=>a.time.localeCompare(b.time));
    const rows = dirSlots.map(s=>{
      const taken = s.taken || 0;
      const expanded = expandedAdminSlots.has(s.id);
      const riders = ridersCache[s.id] || [];
      const ridersHtml = expanded ? `
        <div class="riders-panel admin">
          ${riders.length===0 ? `<div class="riders-empty">No one booked yet.</div>` : riders.map(v=>{
            const locked = !isEditable({ originalTs: Number(v.original_ts) });
            return `<div class="riders-item"><span>${escapeHtml(v.username)} <span style="color:var(--text-dimmer);">#${escapeHtml(v.student_id)}</span></span><span class="riders-meta">${locked?'Locked':'Editable'} · ${new Date(Number(v.ts)).toLocaleString()}</span></div>`;
          }).join('')}
        </div>` : '';
      return `
      <div class="admin-slot-block">
        <div class="admin-row">
          <input type="text" value="${s.time}" data-field="time" data-id="${s.id}" style="width:70px" />
          <input type="number" value="${s.capacity}" data-field="capacity" data-id="${s.id}" style="width:60px" min="1" />
          <span style="flex:1; font-size:11.5px; color:var(--text-dim); font-family:var(--mono);">${taken} booked</span>
          <button class="btn-danger" data-remove="${s.id}">Remove</button>
        </div>
        <button class="riders-toggle" data-admin-riders-toggle="${s.id}" type="button">${expanded?'Hide':'View'} riders${taken?` (${taken})`:''}</button>
        ${ridersHtml}
      </div>`;
    }).join('') || `<div class="empty">No slots yet.</div>`;
    return `
      <div class="section-title">${dir.label}</div>
      ${rows}
      <div class="admin-add">
        <input type="text" placeholder="Time e.g. 09:00" id="newTime_${dir.id}">
        <input type="number" placeholder="Seats" value="${DEFAULT_CAPACITY}" id="newCap_${dir.id}">
        <button class="btn btn-primary" data-add="${dir.id}">Add</button>
      </div>
    `;
  }).join('');

  return `
    <header>
      <div class="board-id"><span class="live-dot"></span><span class="eyebrow">Admin</span></div>
      <h1>Manage Slots</h1>
      <div class="sub">Edits save immediately and apply to all students.</div>
    </header>
    <main>
      ${metrics}
      ${renderChangeRequestsSection()}
      ${groups}
      ${renderVoteHistorySection()}
      <div class="section-title">Danger zone</div>
      <button class="btn btn-danger" id="resetVotes" style="width:100%; padding:12px; border-radius:6px;">Clear all bookings</button>
    </main>
    <footer><span class="admin-link" id="backLink">Back to board</span></footer>
  `;
}
function bindAdmin(){
  document.getElementById('backLink').addEventListener('click', async ()=>{
    adminToken = null;
    if(studentToken){
      role = 'student';
      try{ await loadBoardData(); }catch(e){}
      view = 'board';
    } else {
      role = null;
      view = 'gate';
    }
    render();
  });
  document.querySelectorAll('[data-lightbox]').forEach(img=>{
    img.addEventListener('click', ()=>{
      const req = adminChangeRequests.find(r=>r.id===img.dataset.lightbox);
      if(req) openImageLightbox(req.image_data_url);
    });
  });
  document.querySelectorAll('[data-admin-riders-toggle]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const id = btn.dataset.adminRidersToggle;
      if(expandedAdminSlots.has(id)){ expandedAdminSlots.delete(id); render(); }
      else {
        expandedAdminSlots.add(id);
        try{ await refreshRiders(id); }catch(err){ showToast(err.message); }
        render();
      }
    });
  });
  document.querySelectorAll('input[data-field]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const id = inp.dataset.id, field = inp.dataset.field;
      const value = field==='capacity' ? Math.max(1, parseInt(inp.value)||1) : inp.value;
      try{
        await api(`/slots/${id}`, { method:'PATCH', body: JSON.stringify({ [field]: value }) });
        await refreshSlots();
        showToast('Saved');
        render();
      }catch(err){
        showToast(err.message);
      }
    });
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.remove;
      showModal('Remove this slot?', 'Existing bookings for it will remain on record but the slot will disappear from the board.', async ()=>{
        closeModal();
        try{
          await api(`/slots/${id}`, { method:'DELETE' });
          await refreshSlots();
        }catch(err){ showToast(err.message); }
        render();
      });
    });
  });
  document.querySelectorAll('[data-add]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const dir = btn.dataset.add;
      const timeInp = document.getElementById(`newTime_${dir}`);
      const capInp = document.getElementById(`newCap_${dir}`);
      const time = timeInp.value.trim();
      if(!time){ showToast('Enter a time first'); return; }
      const cap = Math.max(1, parseInt(capInp.value)||DEFAULT_CAPACITY);
      try{
        await api('/slots', { method:'POST', body: JSON.stringify({ direction:dir, time, capacity:cap }) });
        await refreshSlots();
        render();
      }catch(err){
        showToast(err.message);
      }
    });
  });
  document.getElementById('resetVotes').addEventListener('click', ()=>{
    showModal('Clear all bookings?', 'This clears every student booking across every slot. This cannot be undone.', async ()=>{
      closeModal();
      try{
        await api('/votes', { method:'DELETE' });
        await refreshSlots();
        showToast('All bookings cleared');
      }catch(err){
        showToast(err.message);
      }
      render();
    });
  });
  document.querySelectorAll('[data-approve]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.approve;
      const req = adminChangeRequests.find(r=>r.id===id);
      if(!req) return;
      const slotTime = slots.find(s=>s.id===req.slot_id)?.time || '';
      showModal('Approve this change request?', `This releases student ${req.student_id}'s seat on the ${slotTime} slot. They'll be able to pick a new slot next time they open the board.`, async ()=>{
        closeModal();
        try{
          await api(`/change-requests/${id}/approve`, { method:'POST' });
          await Promise.all([refreshAdminChangeRequests(), refreshSlots()]);
          showToast('Approved — seat released');
        }catch(err){
          showToast(err.message);
        }
        render();
      });
    });
  });
  document.querySelectorAll('[data-reject]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const id = btn.dataset.reject;
      showModal('Reject this request?', 'The student stays booked in their current slot.', async ()=>{
        closeModal();
        try{
          await api(`/change-requests/${id}/reject`, { method:'POST' });
          await refreshAdminChangeRequests();
          showToast('Request rejected');
        }catch(err){
          showToast(err.message);
        }
        render();
      });
    });
  });
}

function openImageLightbox(url){
  const div = document.createElement('div');
  div.className='lightbox-overlay';
  div.innerHTML = `<img src="${url}" />`;
  div.addEventListener('click', ()=> div.remove());
  document.body.appendChild(div);
}

function showModal(title, body, onConfirm){
  const div = document.createElement('div');
  div.className='overlay';
  div.id='overlay';
  div.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <p>${body}</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="confirmBtn">Confirm booking</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('confirmBtn').addEventListener('click', onConfirm);
}
function closeModal(){ const o=document.getElementById('overlay'); if(o) o.remove(); }

function showPromptModal(title, placeholder, onSubmit){
  const div = document.createElement('div');
  div.className='overlay'; div.id='overlay';
  div.innerHTML = `
    <div class="modal">
      <h3>${title}</h3>
      <input type="password" id="promptInput" placeholder="${placeholder}"
        style="width:100%;padding:12px;font-size:16px;border-radius:6px;border:1px solid var(--line);
        background:var(--panel);color:var(--text);margin-bottom:16px;font-family:var(--sans);" />
      <div class="modal-actions">
        <button class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button class="btn btn-primary" id="submitBtn">Submit</button>
      </div>
    </div>`;
  document.body.appendChild(div);
  const inp = document.getElementById('promptInput');
  setTimeout(()=>inp.focus(), 50);
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('submitBtn').addEventListener('click', submit);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  function submit(){ const val=inp.value; closeModal(); onSubmit(val); }
}

function showToast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

(function init(){
  render();
})();
</script>
</body>
</html>
